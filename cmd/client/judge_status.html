<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ICPC 客户端</title><style>body{margin:0;background:#f2f5fa;color:#18253c;font:16px/1.7 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{padding:40px;max-width:500px;background:white;border:1px solid #e2e7f0;border-radius:20px;margin:24px}small{color:#53739c;letter-spacing:.12em}h1{font-size:30px;margin:10px 0}p{color:#5d6b80}strong{color:#2764d7}.note{border-top:1px solid #e2e7f0;padding-top:20px;font-size:14px}a{color:#2764d7}</style><main><small>ICPC REMOTE CONTROL</small><h1>从比赛网站登录，即可签到。</h1><p>保持此客户端运行，并连接集控服务器。在比赛网站填写姓名与学号后，网站会自动验证本机连接并完成签到。</p><p><strong>比赛登录后无需单独签退。</strong><br>退出网站账号不会关闭本机或执行签退操作。</p><p class="note">如网站提示无法验证，请检查客户端连接，并在浏览器请求时允许访问本地网络。原有管理流程仍可通过 <a href="/legacy-checkin">旧版签到／签退页面</a> 使用。</p></main></html>
